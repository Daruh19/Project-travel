<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyahat Rotalarım</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sayfanın Başlığı ve Üst Alanı -->
    <header>
        <h1>Seyahat Rotalarım</h1>
    </header>
    
    <!-- Sayfanın Ana İçerik Alanı -->
    <main>
        <!-- İstatistik Bölümü -->
        <section class="istatistik-paneli">
            <div class="kart">
                <h3>Toplam Mekan</h3>
                <p id="toplamMekanSayisi">0</p>
            </div>
            <div class="kart">
                <h3>Ortalama Puan</h3>
                <p id="ortalamaPuanSayisi">0</p>
            </div>
        </section>

        <!-- Filtreleme ve Kontrol Alanı -->
        <section class="kontroller-alani">
            <div style="margin: 10px 0;" id="kategoriButonlari">
                <button data-kategori="hepsi">🏛️🌲 Tümü</button>
                <button data-kategori="Tarihi">🏛️ Tarihi Yerler</button>
                <button data-kategori="Doğa">🌲 Doğa</button>
                <button data-kategori="favori" style="background-color: #e74c3c;">❤️ Favoriler</button>
                <button id="btnApiYukle" style="background-color: #27ae60;">🌐 Sunucudan Rotaları Çek</button>
            </div>

            <div style="margin-bottom:15px;">
                <label><strong>Mekan Ara:</strong></label>
                <input type="text" id="aramaInput" placeholder="Mekan veya şehir adı yazın">
            </div>

            <!-- Ekleme Formu -->
            <div class="form-alani">
                <input type="text" id="sehirAdi" placeholder="Şehir Adı">
                <input type="text" id="mekanAdi" placeholder="Mekan Adı">
                <select id="kategoriSecim">
                    <option value="">Kategori Seçin...</option>
                    <option value="Tarihi">🏛️ Tarihi</option>
                    <option value="Doğa">🌲 Doğa</option>
                    <option value="Deniz">🏖️ Deniz</option>
                </select>
            </div>
            <br>
            
            <div class="buton-alani">
                <button id="ekleBtn">Seyehate ekle</button>
                <button id="temizleBtn">Tümünü temizle</button>
                <button id="btnYuksekPuan">⭐ En Yüksek Puanlılar</button>
                <button id="btnDusukPuan">📉 Düşük Puanlılar</button>
            </div>
        </section>

        <!-- Rota Kartlarının Listelendiği Bölüm -->
        <section class="liste-bolumu">
            <ul id="seyehatListesi"></ul>
        </section>
    </main>
    
    <!-- Sayfadan Bağımsız Diyalog/Pop-up Alanı (Modal) -->
    <aside id="detayModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-kapat-btn" id="modalKapatBtn">✖</button>

            <div class="modal-slider">
                <button class="slider-btn prev-btn" id="sliderPrev">&lt;</button>
                <img id="modalResim" src="" alt="" class="modal-img">
                <button class="slider-btn next-btn" id="sliderNext">&gt;</button>
            </div>
            
            
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="modalBaslik" style="margin: 0;"></h2>
                    <span id="modalKategori" class="mini-tag"></span>
                </div>
                <p id="modalSehir" style="color:#64748b; margin: 8px 0;"></p>
                <p id="modalAciklama" style="line-height: 1.5; color:#334155;"></p>
                <p id="modalPuan" style="font-weight: bold;"></p>
            </div>
        </div>
    </aside>

    <!-- Ana Modül -->
    <script type="module" src="script.js"></script>
</body>
</html>
