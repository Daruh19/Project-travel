<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyahat Rotalarım</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- KARŞILAMA / HERO ALANI -->
    <header class="hero-alani">
        <h1 class="hero-baslik">Dünyayı Keşfetmeye Başla</h1>
        <p class="hero-altbaslik">Unutulmaz rotalar, tarihi mekanlar, büyüleyici sahiller ve doğa harikaları seni bekliyor.</p>
        
        <!-- Canlı Arama Çubuğu -->
        <div class="hero-arama-cubugu">
            <!-- Şehir veya Rota Arama Input'u -->
            <input type="text" id="aramaInput" placeholder="Nereye gitmek istersin?">

            <!-- Tatil Başlangıç Tarihi -->
            <input type="date" id="tarihBaslangic" title="Gidiş Tarihi">

            <!-- Tatil Bitiş Tarihi -->
            <input type="date" id="tarihBitis" title="Dönüş Tarihi">

            <!-- Keşfet Butonu -->
            <button id="aramaBtn">Keşfet</button>
        </div>
    </header>
    
    <!-- ANA İÇERİK KAPSAYICISI -->
    <main class="ana-konteyner">

        <!-- KATEGORİ BARI (id="kategoriButonlari" eklendi, böylece JS hatası çözüldü) -->
        <div class="kategori-bar" id="kategoriButonlari">
            
            <!-- data-kategori="hepsi": JS'e tüm listeyi çizmesini söyler -->
            <button class="kat-btn aktif" data-kategori="hepsi">
                <span class="kat-ikon">🌍</span>
                <span class="kat-yazi">Tüm Rotalar</span>
            </button>

            <button class="kat-btn" data-kategori="Tarihi">
                <span class="kat-ikon">🏛️</span>
                <span class="kat-yazi">Tarihi</span>
            </button>

            <button class="kat-btn" data-kategori="Doğa">
                <span class="kat-ikon">🌲</span>
                <span class="kat-yazi">Doğa</span>
            </button>

            <button class="kat-btn" data-kategori="Deniz">
                <span class="kat-ikon">🏖️</span>
                <span class="kat-yazi">Deniz & Plaj</span>
            </button>

            <!-- Sadece Favorileri Gösteren Buton -->
            <button class="kat-btn" data-kategori="favori">
                <span class="kat-ikon">❤️</span>
                <span class="kat-yazi">Favorilerim</span>
            </button>
            <select name="" id="siralamaSelect">
                
                <option value="puan">En Yüksek Puan</option>
                <option value="isim">A-Z (İsim Sırası)</option>
            </select>
        </div>

        <!-- İSTATİSTİK ÖZET PANELİ (script.js dinamik doldurur) -->
        <div class="istatistik-paneli"></div>

        <!-- ROTA KARTLARININ DİNAMİK BASTIRILDIĞI UL LİSTESİ -->
        <ul id="seyehatListesi"></ul>

    </main>
    
    <!-- DETAY MODAL PENCERESİ -->
    <aside id="detayModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-kapat-btn" id="modalKapatBtn">✖</button>

            <!-- Fotoğraf Slider Alanı -->
            <div class="modal-slider">
                <button class="slider-btn prev-btn" id="sliderPrev">&lt;</button>
                <img id="modalResim" src="" alt="" class="modal-img">
                <button class="slider-btn next-btn" id="sliderNext">&gt;</button>
            </div>
            
            <!-- Modal Bilgi Metinleri -->
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="modalBaslik" style="margin: 0;"></h2>
                    <span id="modalKategori" class="mini-tag"></span>
                </div>
                <p id="modalSehir" style="color:#64748b; margin: 8px 0;"></p>
                <p id="modalAciklama" style="line-height: 1.5; color:#334155;"></p>
                <p id="modalPuan" style="font-weight: bold;"></p>
            </div>
        </div>
    </aside>

    <!-- Ana JavaScript Modülü -->
    <script type="module" src="script.js"></script>
</body>
</html>
